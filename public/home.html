<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/fontawsome/css/all.min.css">
    <link rel="stylesheet" href="/fontawsome/css/fontawesome.min.css">
    <title>Index</title>
</head>
<body>
    <main>
        <div class="page grid home">
            <!-- SIDEBAER -->
            <div class="container flex-column p-0  m-0 sidebar">
                <!-- SIDEBAR LOGO -->
                <div class="flex flex-center sidebar-header">
                    <i class="fa-solid fa-leaf"></i>
                    <div class="container flex-column">
                        <span class="text-sm"><strong>Greens for Growth</strong></span>
                        <span class="text-xs">Farming School</span>
                    </div>
                </div>
                <!-- SIDEBAR OPTIONS -->
                <div class="container flex-column gap-2 sidebar-options p-3">
                    <!-- DASHBOARD -->
                    <a
                        href="/dashboard"
                        class="container flex-center justify-start p-3 gap-3 option selected"
                        data-page="dashboard"
                        aria-current="page"
                    >
                        <i class="fa-solid fa-book"></i>
                        <span class="text-xs">Dashboard</span>
                    </a>
                    <!-- PRODUCTS -->
                    <a
                        href="/products"
                        class="container flex-center justify-start p-3 gap-3 option"
                        data-page="products"
                    >
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span class="text-xs">Products</span>
                    </a>
                    <!-- APPOINTMENTS -->
                    <a
                        href="/appointments"
                        class="container flex-center justify-start p-3 gap-3 option"
                        data-page="appointments"
                    >
                        <i class="fa-regular fa-calendar"></i>
                        <span class="text-xs">Appointments</span>
                    </a>
                    <!-- INQUIRIES -->
                    <a
                        href="/inquiries"
                        class="container flex-center justify-start p-3 gap-3 option"
                        data-page="inquiries"
                    >
                        <i class="fa-regular fa-message"></i>
                        <span class="text-xs">Inquiries</span>
                    </a>
                </div>
            </div>
            <div class="container main-container">
                <header class="container flex-between header">
                    <h1 id="header-text">Dashboard</h1>
                    <div class="icons flex gap-6">
                        <div class="notification-menu" id="notification-menu">
                            <button
                                type="button"
                                class="notification-toggle"
                                id="notification-toggle"
                                aria-label="Notifications"
                                aria-haspopup="true"
                                aria-expanded="false"
                            >
                                <i class="fa-regular fa-bell" aria-hidden="true"></i>
                                <span class="notification-count hidden" id="notification-count"></span>
                            </button>
                            <section
                                class="notification-dropdown hidden"
                                id="notification-dropdown"
                                aria-label="Notification log"
                            >
                                <div class="notification-dropdown-header">
                                    <h2 class="notification-dropdown-title">Notifications</h2>
                                    <button
                                        type="button"
                                        class="notification-mark-all"
                                        id="notification-mark-all"
                                    >
                                        Mark all as read
                                    </button>
                                </div>
                                <ul class="notification-list" id="notification-list">
                                    <li class="notification-empty">Loading notifications...</li>
                                </ul>
                            </section>
                        </div>
                        <div class="account-menu" id="account-menu">
                            <button
                                type="button"
                                class="account-menu-toggle"
                                id="account-menu-toggle"
                                aria-label="Account menu"
                                aria-haspopup="true"
                                aria-expanded="false"
                            >
                                <i class="fa-solid fa-circle-user"></i>
                            </button>
                            <div class="account-menu-dropdown hidden" id="account-menu-dropdown" role="menu">
                                <button type="button" role="menuitem" data-account-action="profile">Account Profile</button>
                                <button type="button" role="menuitem" data-account-action="logout">Log Out</button>
                            </div>
                        </div>
                    </div>
                </header>
                <div class="container" id="main-content"></div>
            </div>
        </div>
        <div class="notif-container"></div>
        <div id="overlay" class="hidden"></div>
    </main>

    <script type="module" src="/js/sidebar/sidebar.js"></script>
</body>
</html>
