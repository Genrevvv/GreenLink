<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1B4332">
    <title>Forgot Password | GreenLink</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/fontawsome/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-brand" aria-label="Greens for Growth">
            <a href="/" class="brand-mark" aria-label="GreenLink home">
                <i class="fa-solid fa-leaf" aria-hidden="true"></i>
            </a>

            <div class="brand-copy">
                <span class="brand-eyebrow">Welcome to</span>
                <h1>Greens for<br>Growth</h1>
                <p class="brand-school">Farming School</p>
                <div class="brand-divider"></div>
            </div>

            <p class="brand-tagline">
                Growing greener connections, one experience at a time.
            </p>
        </section>

        <section class="auth-form-side" aria-labelledby="forgot-password-title">
            <div class="auth-card">
                <div class="card-heading">
                    <span class="card-eyebrow">ACCOUNT RECOVERY</span>
                    <h2 id="forgot-password-title">Forgot Password<span>.</span></h2>
                    <p>
                        Enter the email address associated with your account.
                        We'll send you a link to reset your password.
                    </p>
                </div>

                <form id="forgot-password-form" class="auth-form" novalidate>
                    <div class="auth-field">
                        <label for="email">Email Address</label>
                        <div class="auth-input-wrap">
                            <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                            <input
                                id="email"
                                name="email"
                                type="email"
                                placeholder="Enter your registered email"
                                autocomplete="email"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" id="forgot-password" class="auth-submit">
                        <span>Send Reset Link</span>
                        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    </button>
                </form>

                <div class="auth-switch">
                    <a href="/login">
                        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                        Back to Sign In
                    </a>
                </div>

                <p class="auth-privacy">
                    <i class="fa-solid fa-seedling" aria-hidden="true"></i>
                    Growing together, sustainably.
                </p>
            </div>
        </section>
    </main>

    <script src="/js/auth/forgot-password.js" defer></script>
</body>
</html>
