
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1B4332">
    <title>Sign In | GreenLink</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/fontawsome/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-brand" aria-label="Greens for Growth">
            <a href="/" class="brand-mark" aria-label="GreenLink home">
                <i class="fa-solid fa-leaf" aria-hidden="true"></i>
            </a>

            <div class="brand-copy">
                <span class="brand-eyebrow">Welcome to</span>
                <h1>Greens for<br>Growth</h1>
                <p class="brand-school">Farming School</p>
                <div class="brand-divider"></div>
            </div>

            <p class="brand-tagline">
                Growing greener connections, one experience at a time.
            </p>
        </section>

        <section class="auth-form-side" aria-labelledby="login-title">
            <div class="auth-card">
                <div class="card-heading">
                    <span class="card-eyebrow">YOUR GREENLINK ACCOUNT</span>
                    <h2 id="login-title">Log In<span>.</span></h2>
                    <p>Sign in to continue your journey with us.</p>
                </div>

                <form id="login-form" class="auth-form" novalidate>
                    <div class="auth-message" role="alert" aria-live="polite"></div>

                    <div class="auth-field">
                        <label for="username">Username or email</label>
                        <div class="auth-input-wrap">
                            <i class="fa-regular fa-user" aria-hidden="true"></i>
                            <input
                                id="username"
                                name="username"
                                type="text"
                                placeholder="Enter your username or email"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <div class="auth-input-wrap">
                            <i class="fa-solid fa-lock" aria-hidden="true"></i>
                            <input
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <button
                                type="button"
                                class="password-toggle"
                                aria-label="Show password"
                                aria-pressed="false"
                            >Show</button>
                        </div>
                    </div>

                    <div class="auth-options">
                        <a href="/forgot-password" class="auth-text-link">Forgot password?</a>
                    </div>

                    <button type="submit" id="login" class="auth-submit">
                        <span>Sign In</span>
                        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    </button>
                </form>

                <div class="auth-switch">
                    <span>New to GreenLink?</span>
                    <a href="/register">Create an account</a>
                </div>

                <p class="auth-privacy">
                    <i class="fa-solid fa-seedling" aria-hidden="true"></i>
                    Growing together, sustainably.
                </p>
            </div>
        </section>
    </main>

    <script src="/js/auth/login.js" defer></script>
</body>
</html>
