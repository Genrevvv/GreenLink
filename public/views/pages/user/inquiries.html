<div class="inquiries-page">
    <div class="user-inquiries-grid grid grid-2">

        <!-- INQUIRY FORM -->
        <section class="dashboard-card dashboard-card-lg inquiries-panel">
            <div class="inquiries-panel-header header-dark flex align-center gap-2">
                <i class="fa-regular fa-message"></i>
                Submit New Inquiry
            </div>

            <div class="inquiries-panel-body">
                <form id="user-inquiry-form" class="inquiry-form flex-column" novalidate>
                    <div class="inquiry-field flex-column">
                        <label for="inquiry-subject" class="inquiry-label">Subject</label>
                        <input type="text" id="inquiry-subject" class="inquiry-input"
                            placeholder="e.g., Product inquiry, Delivery question" required>
                    </div>

                    <div class="inquiry-field flex-column">
                        <label for="inquiry-message" class="inquiry-label">Message</label>
                        <textarea id="inquiry-message" class="inquiry-input inquiry-textarea" rows="8"
                            placeholder="Please provide detailed information about your inquiry..." required></textarea>
                    </div>

                    <button type="submit" class="inquiry-primary-btn flex-center gap-2">
                        <i class="fa-regular fa-paper-plane"></i> Submit Inquiry
                    </button>
                </form>

                <div class="inquiry-response-time">
                    <p class="inquiry-response-time-title">Response Time</p>
                    <p class="inquiry-response-time-text">
                        We typically respond to inquiries within 24-48 hours during business days.
                    </p>
                </div>
            </div>
        </section>

        <!-- PREVIOUS INQUIRIES -->
        <section class="dashboard-card dashboard-card-lg inquiries-panel">
            <div class="inquiries-panel-header header-light">Previous Inquiries</div>

            <div class="inquiries-panel-body">
                <ul class="previous-inquiries-list flex-column" id="user-inquiries-list"></ul>
            </div>
        </section>
    </div>
</div>
