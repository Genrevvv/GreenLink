<div class="main-container-dashboard admin-dashboard flex-column gap-8">

    <!-- INVENTORY SUMMARY CARDS (rendered from js/dashboard/dashboard-data.js) -->
    <div class="admin-stat-cards grid" id="admin-stat-cards"></div>

    <!-- CHART + STOCK ALERTS -->
    <div class="admin-dashboard-row grid">
        <!-- Doughnut Chart -->
        <section class="dashboard-card dashboard-panel inventory-panel">
            <div class="dashboard-panel-head">
                <h3 class="dashboard-panel-title">Inventory Availability</h3>
                <p class="dashboard-panel-sub">Distribution by stock status</p>
            </div>

            <div class="inventory-chart flex-column flex-center gap-3" id="inventory-chart">
                <div class="inventory-donut" id="inventory-donut" role="img" aria-label="Products by stock status"></div>
                <div class="inventory-legend flex justify-center gap-3" id="inventory-legend"></div>
                <div class="inventory-tooltip hidden" id="inventory-tooltip"></div>
            </div>
        </section>

        <!-- Stock Alerts -->
        <section class="dashboard-card dashboard-panel alerts-panel">
            <div class="dashboard-panel-head flex-between gap-3">
                <div>
                    <h3 class="dashboard-panel-title">Stock Alerts</h3>
                    <p class="dashboard-panel-sub">Products needing attention</p>
                </div>
                <button type="button" class="dashboard-link-btn flex align-center gap-1" data-page="products">
                    View Products <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <ul class="flex-column gap-3" id="stock-alerts-list"></ul>
        </section>
    </div>

    <!-- UPCOMING APPOINTMENTS -->
    <section class="dashboard-card dashboard-panel">
        <div class="dashboard-panel-head flex-between gap-3">
            <div>
                <h3 class="dashboard-panel-title flex align-center gap-2">
                    <i class="fa-regular fa-calendar"></i> Upcoming Appointments
                </h3>
                <p class="dashboard-panel-sub">Scheduled visits and enrollments</p>
            </div>
            <button type="button" class="dashboard-link-btn flex align-center gap-1" data-page="appointments">
                View All <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <ul class="upcoming-appointments-grid grid grid-2" id="upcoming-appointments-list"></ul>
    </section>
</div>
