<div class="main-container-dashboard admin-dashboard container p-4 flex-column gap-4">

    <!-- SUMMARY CARDS (rendered from js/dashboard/dashboard-data.js) -->
    <div class="admin-stat-cards grid gap-4" id="admin-stat-cards"></div>

    <div class="admin-dashboard-row grid gap-4">
        <!-- INVENTORY AVAILABILITY -->
        <section class="dashboard-panel flex-column">
            <div class="flex-column">
                <h3 class="dashboard-panel-title">Inventory Availability</h3>
                <span class="text-xs dashboard-row-sub">Distribution by stock status</span>
            </div>

            <div class="flex-column align-center gap-2 flex-1 justify-center">
                <div class="inventory-donut" id="inventory-donut" role="img" aria-label="Products by stock status"></div>
                <div class="inventory-legend flex gap-3" id="inventory-legend"></div>
            </div>
        </section>

        <!-- STOCK ALERTS -->
        <section class="dashboard-panel flex-column gap-4">
            <div class="flex-between">
                <div class="flex-column">
                    <h3 class="dashboard-panel-title">Stock Alerts</h3>
                    <span class="text-xs dashboard-row-sub">Products needing attention</span>
                </div>
                <button type="button" class="dashboard-link-btn flex align-center gap-2" data-page="products">
                    View Products <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <ul class="flex-column gap-2" id="stock-alerts-list"></ul>
        </section>
    </div>

    <!-- UPCOMING APPOINTMENTS -->
    <section class="dashboard-panel flex-column gap-4">
        <div class="flex-between">
            <div class="flex-column">
                <h3 class="dashboard-panel-title flex align-center gap-2">
                    <i class="fa-regular fa-calendar"></i> Upcoming Appointments
                </h3>
                <span class="text-xs dashboard-row-sub">Scheduled visits and enrollments</span>
            </div>
            <button type="button" class="dashboard-link-btn flex align-center gap-2" data-page="appointments">
                View All <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <ul class="upcoming-appointments-grid grid grid-2 gap-2" id="upcoming-appointments-list"></ul>
    </section>
</div>
