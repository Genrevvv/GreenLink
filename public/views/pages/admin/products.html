<div class="container p-4">
    <!-- SUMMARY CARDS -->
    <div class="container flex-center gap-4 mt-4">
        <div class="container flex-column align-center shadow-bottom rounded-sm py-4 bd-lg">
            <span class="text-xs">Total Products</span>
            <h2 id="total-products" class="text-lg">6</h2>
        </div>
        <div class="container flex-column align-center shadow-bottom rounded-sm py-4 bd-lg">
            <span class="text-xs">In Stock</span>
            <h2 id="in-stock" class="text-lg text-bg">5</h2>
        </div>
        <div class="container flex-column align-center shadow-bottom rounded-sm py-4 bd-lg">
            <span class="text-xs">Out of Stock</span>
            <h2 id="out-of-stock" class="text-lg">1</h2>
        </div>
    </div>
    
    <!-- PRODUCT MANAGEMENT -->
     <div class="mt-4 p-4 product-management-container">
        <h2 class="text-sm w-full">Product Inventory</h2>

        <!-- Container Header -->
        <div class="container flex-between text-white gap-1 p-2">

            <!-- Search Bar -->
            <div class="product-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="product-search" placeholder="Search products...">
            </div>
            
            <!-- Category Filter -->
            <select class="product-filter" id="filter-product-category">
                <option value="all">All Category</option>
                <option value="approved">Vegetables</option>
                <option value="completed">Poultry</option>
                <option value="completed">Fruits</option>
            </select>

            <!-- Status Filter -->
            <select class="product-filter" id="filter-product-status">
                <option value="all">All Statuses</option>
                <option value="pending">In Stock</option>
                <option value="approved">Out of Stock</option>
            </select>

            <!-- Product Inventory Actions -->
            <div class="container flex justify-end gap-1">
                <div class="inventory-action" id="view-archieved">View Archived</div>
                <div class="inventory-action" id="add-product">+ Add Product</div>
            </div>
        </div>

        <!-- Products List -->
        <div class="container mt-4">
            <table class="table-component products-table">
                <tr>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Availability</th>
                    <th>Actions</th>
                </tr>
                <!-- product rows -->
                 <!-- <tr>
                    <td>Lettuce</td>
                    <td>Vegatable</td>
                    <td>
                        <span class="in-stock">In stock</span>
                    </td>
                    <td>
                        <i class="fa-solid fa-pen-to-square"></i>
                        <i class="fa-solid fa-box-archive"></i>
                    </td>
                 </tr> -->
            </table>
        </div>
     </div>
</div>
