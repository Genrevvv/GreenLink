<div class="container p-4">
    <!-- SUMMARY CARDS -->
    <div class="container flex-center gap-4 mt-4">
        <div class="container flex-column align-center shadow-bottom rounded-sm py-4 bd-lg">
            <span class="text-xs">Total Orders</span>
            <h2 id="total-orders" class="text-lg">7</h2>
        </div>
        <div class="container flex-column align-center shadow-bottom rounded-sm py-4 bd-lg">
            <span class="text-xs">Pending</span>
            <h2 id="pending-orders" class="text-lg text-yg">3</h2>
        </div>
        <div class="container flex-column align-center shadow-bottom rounded-sm py-4 bd-lg">
            <span class="text-xs">Approved</span>
            <h2 id="approved-orders" class="text-lg text-dg">2</h2>
        </div>
        <div class="container flex-column align-center shadow-bottom rounded-sm py-4 bd-lg">
            <span class="text-xs">Completed</span>
            <h2 id="completed-orders" class="text-lg text-bg">2</h2>
        </div>
    </div>
    
    <!-- ORDER MANAGEMENT -->
     <div class="mt-4 order-management-container bd-lg">
        <!-- Container Header -->
        <div class="container flex-between bg-g-drd text-white p-2">
            <h2 class="text-sm w-full">Order Management</h2>

            <div class="container flex justify-end align-center gap-2 order-header-actions">
                <!-- Search Bar -->
                <div class="order-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-order" placeholder="Search orders...">
                </div>

                <!-- Status Filter -->
                <select id="filter-order-status">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
        </div>

        <!-- Order List -->
        <div class="container mt-4">
            <table class="table-component order-management-table">
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                <!-- Orders rows -->
            </table>
        </div>
     </div>
</div>
