<div class="inquiries-page">
    <!-- SUMMARY CARDS (counted from js/inquiries/inquiries-data.js) -->
    <div class="inquiries-summary grid">
        <div class="dashboard-card dashboard-card-lg inquiries-summary-card text-center">
            <p class="inquiries-summary-label">Total Inquiries</p>
            <p class="inquiries-summary-value value-total" id="inquiries-total-count">0</p>
        </div>
        <div class="dashboard-card dashboard-card-lg inquiries-summary-card text-center">
            <p class="inquiries-summary-label">Pending</p>
            <p class="inquiries-summary-value value-pending" id="inquiries-pending-count">0</p>
        </div>
        <div class="dashboard-card dashboard-card-lg inquiries-summary-card text-center">
            <p class="inquiries-summary-label">Responded</p>
            <p class="inquiries-summary-value value-responded" id="inquiries-responded-count">0</p>
        </div>
    </div>

    <div class="inquiries-workspace grid">
        <!-- INQUIRY MANAGEMENT -->
        <section class="dashboard-card dashboard-card-lg inquiries-panel inquiries-table-panel">
            <div class="inquiries-panel-header header-dark">Inquiry Management</div>

            <div class="inquiries-table-wrapper">
                <table class="inquiries-table">
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Subject</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inquiries-tbody"></tbody>
                </table>
            </div>
        </section>

        <!-- INQUIRY DETAILS -->
        <section class="dashboard-card dashboard-card-lg inquiries-panel">
            <div class="inquiries-panel-header header-light">Inquiry Details</div>
            <div class="inquiries-panel-body" id="inquiry-details"></div>
        </section>
    </div>
</div>
