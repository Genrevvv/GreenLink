<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="fontawsome/css/all.min.css">
    <link rel="stylesheet" href="fontawsome/css/fontawesome.min.css">
    <title>Index</title>
</head>
<body>
    <main>
        <div class="page grid home">
            <!-- SIDEBAER -->
            <div class="container flex-column p-0  m-0 sidebar">
                <!-- SIDEBAR LOGO -->
                <div class="flex flex-center sidebar-header">
                    <i class="fa-solid fa-leaf"></i>
                    <div class="container flex-column">
                        <span class="text-sm"><strong>Greens for Growth</strong></span>
                        <span class="text-xs">Farming School</span>
                    </div>
                </div>
                <!-- SIDEBAR OPTIONS -->
                <div class="container flex-column gap-2 sidebar-options p-3">
                    <!-- DASHBOARD -->
                    <div class="container flex-center justify-start p-3 gap-3 option selected" data-page="dashboard">
                        <i class="fa-solid fa-book"></i>
                        <span class="text-xs">Dashboard</span>
                    </div>
                    <!-- PRODUCTS -->
                    <div class="container flex-center justify-start p-3 gap-3 option" data-page="products">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span class="text-xs">Products</span>
                    </div>
                    <!-- APPOINTMENTS -->
                    <div class="container flex-center justify-start p-3 gap-3 option" data-page="appointments">
                        <i class="fa-regular fa-calendar"></i>
                        <span class="text-xs">Appointments</span>
                    </div>
                    <!-- ORDERS -->
                    <div class="container flex-center justify-start p-3 gap-3 option" data-page="orders">
                        <i class="fa-regular fa-calendar"></i>
                        <span class="text-xs">Orders</span>
                    </div>
                    <!-- INQUIRIES -->
                    <div class="container flex-center justify-start p-3 gap-3 option" data-page="inquiries">
                        <i class="fa-regular fa-message"></i>
                        <span class="text-xs">Inquiries</span>
                    </div>
                </div>
                <!-- LOG OUT -->
                <div class="container logout-container ">
                    <div id="logout" class="flex gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span class="text-xs">Log out</span>
                    </div>
                </div>
            </div>
            <div class="container main-content">
                <header class="container flex-between header">
                    <h1>Dashboard</h1>
                    <div class="icons flex gap-6">
                        <i class="fa-regular fa-bell"></i>
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                </header>
                <div class="container"></div>
            </div>
        </div>
    </main>

    <script type="module" src="js/sidebar/sidebar.js"></script>
</body>
</html>
